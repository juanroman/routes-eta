[project]
name = "route-eta-api"
version = "0.1.0"
description = "Route ETA Phase 1 backend: route builder JSON API (and, later, the checker/notifier/scheduler)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "requests>=2.32,<3",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "httpx>=0.27,<1",
    "black>=26.10.1,<27",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "pip-audit>=2.7,<3",
    "types-PyYAML>=6.0,<7",
    "types-requests>=2.32,<3",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # black owns line length

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests/"]

[tool.pytest.ini_options]
markers = [
    "integration: hits the real Google Routes API (needs GOOGLE_ROUTES_API_KEY)",
]
addopts = "-m 'not integration'"
